<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="theme-color" content="#fdfdfd" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0d0d10" media="(prefers-color-scheme: dark)">

  {% if page.title %}
    <title>{{ page.title }} | {{ site.title }}</title>
  {% else %}
    <title>{{ site.title }} - {{ site.tagline }}</title>
  {% endif %}

  <meta name="description" content="{{ page.description | default: site.description | strip_html | normalize_whitespace | truncate: 160 | escape }}">
  <meta name="author" content="{{ site.social.name }}">

  <!-- Theme + motion boot: runs before first paint to avoid a flash.
       `motion-ready` is what hides revealed content, so it self-removes if
       site-motion.js never confirms it booted. -->
  <script>
    (function () {
      var root = document.documentElement;

      var theme = 'light';
      try {
        var stored = localStorage.getItem('site-theme');
        if (stored === 'light' || stored === 'dark') {
          theme = stored;
        } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
          theme = 'dark';
        }
      } catch (e) {
        /* storage blocked — keep the light default */
      }
      root.setAttribute('data-theme', theme);

      var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      if (reduce) {
        return;
      }

      root.classList.add('motion-ready');
      window.setTimeout(function () {
        if (!root.classList.contains('motion-active')) {
          root.classList.remove('motion-ready');
        }
      }, 2500);
    })();
  </script>

  <!-- hreflang alternates for the three site languages -->
  {% for tongue in site.languages %}
    {% if tongue == site.default_lang %}
      <link rel="alternate" hreflang="{{ tongue }}" href="{{ site.url }}{{ page.url }}">
    {% else %}
      <link rel="alternate" hreflang="{{ tongue }}" href="{{ site.url }}/{{ tongue }}{{ page.url }}">
    {% endif %}
  {% endfor %}
  <link rel="alternate" hreflang="x-default" href="{{ site.url }}{{ page.url }}">

  <!-- Favicon -->
  <link rel="icon" type="image/png" sizes="32x32" href="{{ '/assets/img/favicons/favicon-32x32.png' | relative_url }}">
  <link rel="icon" type="image/png" sizes="16x16" href="{{ '/assets/img/favicons/favicon-16x16.png' | relative_url }}">
  <link rel="apple-touch-icon" sizes="180x180" href="{{ '/assets/img/favicons/apple-touch-icon.png' | relative_url }}">
  <link rel="manifest" href="{{ '/assets/img/favicons/manifest.webmanifest' | relative_url }}">

  <!-- Fonts -->
  {% include head-fonts-minimalist.html %}

  <!-- Motion libraries are pulled from jsDelivr at the end of <body> -->
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>

  <!-- Stylesheet -->
  <link rel="stylesheet" href="{{ '/assets/css/jekyll-theme-chirpy.css' | relative_url }}">

  <!-- RSS Feed -->
  <link rel="alternate" type="application/rss+xml" title="{{ site.title }}" href="{{ '/feed.xml' | relative_url }}">

  <!-- Canonical, Open Graph, Twitter cards and JSON-LD all come from
       jekyll-seo-tag; do not duplicate them by hand here. -->
  {% seo %}
</head>
